seed: 42

data:
  train_src: Data/tokenized/train.ar.bpe
  train_tgt: Data/tokenized/train.en.bpe
  val_src: Data/tokenized/validation.ar.bpe
  val_tgt: Data/tokenized/validation.en.bpe
  test_src: Data/tokenized/test.ar.bpe
  test_tgt: Data/tokenized/test.en.bpe
  src_vocab: Data/vocab/sp_ar.vocab
  tgt_vocab: Data/vocab/sp_en.vocab
  src_spm: Data/vocab/sp_ar.model
  tgt_spm: Data/vocab/sp_en.model
  max_len: 80

model:
  d_model: 128
  nhead: 4
  num_encoder_layers: 2
  num_decoder_layers: 2
  dim_feedforward: 512
  dropout: 0.1

training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.0
  label_smoothing: 0.0
  clip_grad_norm: 1.0
  num_workers: 0
  device: auto
  output_dir: outputs/checkpoints
  log_every: 100
  early_stopping_patience: 3

decoding:
  max_len: 80
  beam_size: 1
  samples: 20

